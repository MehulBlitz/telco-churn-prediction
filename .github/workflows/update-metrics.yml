name: Retrain & refresh metrics

on:
  schedule:
    - cron: "17 4 1 * *"   # monthly: 04:17 UTC on the 1st
  workflow_dispatch:        # manual run button
  push:
    paths: [ "train_churn.py", "download_data.py" ]

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset + retrain + regenerate figures
        run: |
          python download_data.py
          python train_churn.py

      - name: Commit refreshed metrics + figures
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/metrics.json artifacts/feature_importance.csv figures/ || true
          git add data/telco_customer_churn.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No metric changes since last run"
          else
            git commit -m "chore: refresh metrics (scheduled retrain) [skip ci]"
            git push
          fi
